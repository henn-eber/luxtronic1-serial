name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          pip list | grep -E "pytest|coverage|voluptuous|serial"
      - name: Debug collect
        run: |
          pytest --collect-only -q
          python -c "import sys; print(sys.version)"
      - name: Run tests with coverage
        run: |
          pytest --cov=custom_components/luxtronic1 \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=95 -v --tb=short

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          pip list | grep -E "pytest|serial"
      - name: Run emulator HIL (no hardware, PTY + fake responder)
        run: |
          pytest tests/test_emulator_hil.py -v --tb=long
      - name: Debug PTY
        if: always()
        run: |
          ls -l /dev/pts || true
          python -c "import pty, os; fd, path = pty.openpty(); print(path); os.close(fd)"
