name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip list | grep -E "pytest|coverage|voluptuous|serial"
          python -c "import sys; print(sys.version)"
      - name: Debug collect
        run: |
          python -m pytest --collect-only -q -v 2>&1 | head -100
      - name: Run tests with coverage
        run: |
          python -m pytest --cov=custom_components/luxtronic1 \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=95 -v --tb=long 2>&1 | tee /tmp/pytest.log
          EXIT=${PIPESTATUS[0]}
          echo "## pytest log" >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest.log >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest.log
          exit $EXIT

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip list | grep -E "pytest|serial"
      - name: Debug PTY
        run: |
          ls -l /dev/pts || true
          python -c "import pty, os; fd, path = pty.openpty(); print('pty ok', path); os.close(fd)"
          python -c "import sys; print(sys.version)"
      - name: Run emulator HIL (no hardware, PTY + fake responder)
        run: |
          python -m pytest tests/test_emulator_hil.py -v --tb=long 2>&1 | tee /tmp/emu.log
          EXIT=${PIPESTATUS[0]}
          echo "## emulator log" >> $GITHUB_STEP_SUMMARY
          cat /tmp/emu.log >> $GITHUB_STEP_SUMMARY
          cat /tmp/emu.log
          exit $EXIT
