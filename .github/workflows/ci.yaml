name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/.github/workflows@master
        with:
          category: integration

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
      - name: Run tests with coverage
        run: |
          pytest --cov=custom_components/luxtronic1 \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=95
