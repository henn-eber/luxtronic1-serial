name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate version matches manifest
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST=$(python -c "import json; print(json.load(open('custom_components/luxtronic1/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match manifest.json version $MANIFEST"
            exit 1
          fi
          echo "Version $TAG matches manifest"

      - uses: home-assistant/actions/hassfest@master

      - name: Zip integration
        run: |
          zip -r luxtronic1.zip custom_components/luxtronic1 -x "*.pyc" "*__pycache__*"
          unzip -l luxtronic1.zip | head -20
          ls -lh luxtronic1.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: luxtronic1.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
